<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d6dff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Расписание</title>
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --text:#12161c; --muted:#7c8695;
  --accent:#3d6dff; --accent-soft:#e8efff; --border:#e4e8ef;
  --danger:#e5484d; --radius:16px;
  --hw-bg:linear-gradient(135deg,#eef4ff 0%,#f7faff 100%);
}
[data-theme="dark"]{
  --bg:#0f1116; --card:#1a1d24; --text:#e6e9ef; --muted:#8a92a3;
  --accent:#5b83ff; --accent-soft:#1b2540; --border:#262b36;
  --danger:#ff6b6e;
  --hw-bg:linear-gradient(135deg,#1c2745 0%,#161c30 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
header{background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;padding-top:env(safe-area-inset-top);transition:background .2s ease,border-color .2s ease;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 2px;gap:8px;}
.brand{font-weight:700;font-size:18px;letter-spacing:-.3px;}
.top-actions{display:flex;gap:8px;}
.chip{border:none;background:var(--accent-soft);color:var(--accent);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.chip:active{opacity:.7;}
.icon-btn{border:none;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-btn.on{background:var(--accent);color:#fff;}
.navbar{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;}
.nav-arrow{border:none;background:var(--bg);width:36px;height:34px;border-radius:10px;font-size:20px;line-height:1;color:var(--text);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.nav-arrow:active{background:var(--accent-soft);color:var(--accent);}
.nav-label{flex:1;text-align:center;font-size:14px;color:var(--muted);font-weight:600;}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;}
#content{padding:14px 14px 28px;will-change:transform,opacity;}
#content.anim{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:.35}to{opacity:1}}
.day-head{margin-bottom:14px;}
.day-head .dow{font-size:22px;font-weight:700;letter-spacing:-.4px;}
.day-head .date{font-size:14px;color:var(--muted);margin-top:3px;}
.badge-today{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:7px;margin-left:7px;vertical-align:3px;text-transform:uppercase;}
.lessons{display:flex;flex-direction:column;gap:10px;}
.lesson{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,30,50,.06);border-left:3px solid transparent;padding:14px;cursor:pointer;transition:box-shadow .15s,background .2s ease;}
.lesson.has-hw{border-left-color:var(--accent);}
.lesson.expanded{box-shadow:0 4px 14px rgba(20,30,50,.09);}
.lesson-row{display:flex;gap:12px;align-items:flex-start;}
.time-col{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.time-col .time{font-weight:700;font-size:12.5px;letter-spacing:-.2px;white-space:nowrap;}
.time-col .num{font-size:11px;color:var(--muted);}
.info{flex:1;min-width:0;}
.subject{font-weight:600;font-size:16px;line-height:1.25;word-break:break-word;}
.chev{margin-left:auto;color:var(--muted);font-size:20px;line-height:1;transition:transform .18s ease;padding-left:6px;flex:0 0 auto;user-select:none;}
.lesson.expanded .chev{transform:rotate(90deg);color:var(--accent);}
.details{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);animation:fadeIn .15s ease;}
.lesson.expanded .details{display:block;}
.detail-row{margin-bottom:11px;}
.detail-row:last-child{margin-bottom:0;}
.detail-label{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.detail-value{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.detail-value.room{font-weight:600;}
.detail-value.teacher{font-weight:500;}
.no-hw{color:var(--muted);font-style:italic;font-size:13.5px;}
.no-teacher{color:var(--muted);font-style:italic;font-size:13.5px;}
.hw-display{position:relative;background:var(--hw-bg);border:1.5px solid var(--accent);border-left-width:5px;border-radius:12px;padding:13px 14px 13px 15px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text);box-shadow:0 2px 10px rgba(61,109,255,.10);}
.hw-display::before{content:'ДЗ';display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:1px;}
.hw-view-row{display:flex;gap:10px;align-items:flex-start;}
.hw-view-row .hw-display{flex:1;min-width:0;}
.hw-view-row .no-hw{flex:1;min-width:0;display:flex;align-items:center;min-height:42px;padding:0 4px;}
.pencil-btn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);border:none;font-size:17px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease;}
.pencil-btn:active{transform:scale(.92);background:var(--accent);color:#fff;}
.hw-edit{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;resize:vertical;min-height:60px;}
.hw-edit:focus{border-color:var(--accent);background:var(--card);}
.hw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.save-hw{padding:9px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
.save-hw:active{opacity:.85;}
.delete-hw{padding:9px 16px;border-radius:10px;border:none;background:rgba(229,72,77,.12);color:var(--danger);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
.delete-hw:active{opacity:.8;}
.cancel-hw{padding:9px 16px;border-radius:10px;border:none;background:var(--bg);color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;}
.cancel-hw:active{opacity:.75;}
.btn-edit-lesson{margin-top:8px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;}
.empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:15px;}
.empty .big{font-size:34px;display:block;margin-bottom:10px;}
.add-btn{margin-top:14px;width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.4;}
.week-view{display:flex;flex-direction:column;gap:8px;}
.week-day{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,50,.05);}
.week-day.today{box-shadow:inset 0 0 0 2px var(--accent);}
.wd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.wd-name{font-weight:700;font-size:14px;}
.wd-date{font-size:12px;color:var(--muted);}
.wd-lesson{font-size:13px;padding:2.5px 0;display:flex;gap:8px;align-items:baseline;}
.wd-lesson b{color:var(--muted);font-weight:600;font-size:11.5px;flex:0 0 72px;letter-spacing:-.2px;}
.wd-lesson .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wd-lesson .mark{color:#ff9f0a;font-size:11px;}
.wd-empty{color:var(--muted);font-size:13px;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px;}
.weekdays div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;cursor:pointer;position:relative;user-select:none;box-shadow:0 1px 2px rgba(20,30,50,.04);}
.cell.empty{background:transparent;box-shadow:none;cursor:default;}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
.cell.sel{background:var(--accent);color:#fff;box-shadow:none;}
.dnum{font-weight:600;line-height:1;}
.dots{display:flex;gap:3px;height:5px;}
.dot{width:5px;height:5px;border-radius:50%;}
.lesson-dot{background:var(--accent);}
.hw-dot{background:#ff9f0a;}
.cell.sel .dot{background:rgba(255,255,255,.92);}
.legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:5px;}
.bottom{display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto;transition:background .2s ease,border-color .2s ease;}
.bottom button{flex:1;border:none;background:none;padding:12px 0 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;letter-spacing:.2px;}
.bottom button.active{color:var(--accent);}
.modal-back{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeBg .15s ease;}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);color:var(--text);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:slideUp .22s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:560px){.modal-back{align-items:center;}.modal{border-radius:20px;max-width:470px;}}
.modal-title{font-size:18px;font-weight:700;margin-bottom:18px;}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;}
.modal input{width:100%;margin-top:5px;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.modal input:focus{border-color:var(--accent);background:var(--card);}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ghost{background:var(--bg);color:var(--muted);}
.btn.primary{background:var(--accent);color:#fff;}
.btn.danger{background:rgba(229,72,77,.12);color:var(--danger);}
.settings-section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.settings-section:last-of-type{border-bottom:none;padding-bottom:0;margin-bottom:0;}
.settings-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.settings-hint{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.4;}
.theme-toggle{display:flex;gap:8px;}
.theme-opt{flex:1;padding:13px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s ease;}
.theme-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.admin-status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;margin-bottom:10px;}
.admin-status .dot-on{width:8px;height:8px;border-radius:50%;background:#22c55e;}
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--muted);margin-left:8px;vertical-align:2px;}
.sync-badge.ok{color:#16a34a;}
.sync-badge.err{color:var(--danger);}
.sync-badge.sync{color:var(--accent);}

/* Диалог выбора браузера */
#launchChoice{position:fixed;inset:0;background:rgba(15,20,30,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fadeBg .25s ease;}
.launch-card{background:var(--card);color:var(--text);border-radius:22px;padding:26px 22px 22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .3s cubic-bezier(.2,.9,.3,1);}
.launch-title{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center;letter-spacing:-.3px;}
.launch-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.4;}
.launch-btn{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;text-align:left;margin-bottom:10px;transition:all .15s ease;}
.launch-btn:last-child{margin-bottom:0;}
.launch-btn:active{transform:scale(.98);border-color:var(--accent);background:var(--accent-soft);}
.launch-btn .lb-icon{font-size:26px;flex:0 0 auto;}
.launch-btn .lb-text{flex:1;min-width:0;}
.launch-btn .lb-title{font-weight:700;font-size:15px;display:block;margin-bottom:2px;}
.launch-btn .lb-sub{font-size:12px;color:var(--muted);display:block;line-height:1.3;}

/* Плашка установки */
#installBanner{
  position:fixed;left:12px;right:12px;
  bottom:calc(70px + env(safe-area-inset-bottom));
  background:var(--card);color:var(--text);
  border-radius:16px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
  padding:14px 14px 12px;
  display:flex;align-items:flex-start;gap:10px;
  z-index:200;
  animation:hsSlideUp .35s cubic-bezier(.2,.9,.3,1);
  border:1px solid var(--border);
}
@keyframes hsSlideUp{from{transform:translateY(80px);opacity:0;}to{transform:translateY(0);opacity:1;}}
#installBanner .ib-icon{font-size:24px;flex:0 0 auto;line-height:1.1;padding-top:2px;}
#installBanner .ib-text{flex:1;min-width:0;}
#installBanner .ib-title{font-weight:700;font-size:15px;margin-bottom:3px;}
#installBanner .ib-sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-bottom:10px;}
#installBanner .ib-actions{display:flex;gap:8px;flex-wrap:wrap;}
#installBanner .ib-btn{
  flex:1;min-width:100px;
  padding:10px 14px;border-radius:10px;border:none;
  font-size:13.5px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:opacity .15s ease;
}
#installBanner .ib-btn:active{opacity:.8;}
#installBanner .ib-btn.primary{background:var(--accent);color:#fff;}
#installBanner .ib-btn.ghost{background:var(--bg);color:var(--muted);}
#installBanner .ib-close{
  flex:0 0 auto;background:transparent;border:none;
  color:var(--muted);font-size:18px;cursor:pointer;
  padding:0 4px;font-family:inherit;align-self:flex-start;
  line-height:1.1;
}

.help-steps{font-size:14px;line-height:1.6;color:var(--text);}
.help-steps ol{padding-left:22px;margin:10px 0;}
.help-steps li{margin-bottom:8px;}
.help-steps code{
  display:inline-block;
  background:var(--bg);color:var(--accent);
  padding:2px 7px;border-radius:6px;
  font-size:12.5px;word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.help-steps b{color:var(--accent);}
.help-note{
  background:var(--accent-soft);color:var(--accent);
  padding:10px 12px;border-radius:10px;
  font-size:12.5px;line-height:1.45;margin-top:12px;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand">Расписание<span class="sync-badge" id="syncBadge"></span></div>
      <div class="top-actions">
        <button class="chip" id="todayBtn">Сегодня</button>
        <button class="icon-btn" id="adminBtn">⚙</button>
      </div>
    </div>
    <div class="navbar">
      <button class="nav-arrow" id="prevBtn">‹</button>
      <div class="nav-label" id="navLabel"></div>
      <button class="nav-arrow" id="nextBtn">›</button>
    </div>
  </header>
  <main id="main"><div id="content"></div></main>
  <nav class="bottom">
    <button data-view="day" class="active">День</button>
    <button data-view="week">Неделя</button>
    <button data-view="month">Месяц</button>
  </nav>
</div>

const store = {
  get(k, def){ try{ const v = localStorage.getItem('sched_'+k); return v ? JSON.parse(v) : def; } catch(e){ return def; } },
  set(k, v){ localStorage.setItem('sched_'+k, JSON.stringify(v)); }
};

(function migrate(){
  if (store.get('version', 0) !== VERSION){
    store.set('schedule', DEFAULT_SCHEDULE);
    store.set('version', VERSION);
  }
})();

let schedule = store.get('schedule', DEFAULT_SCHEDULE);
let homework = store.get('homework', {});
let isAdmin = store.get('admin', false);
let currentTheme = store.get('theme', 'light');
let shortNames = store.get('shortNames', true);
let browserChoice = store.get('browserChoice', null);

function applyTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  store.set('theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1d24' : '#3d6dff');
}

const syncBadge = document.getElementById('syncBadge');
function setSync(state, text){
  if (!syncBadge) return;
  syncBadge.className = 'sync-badge ' + (state || '');
  syncBadge.textContent = text || '';
  if (state === 'ok'){
    setTimeout(() => {
      if (syncBadge.classList.contains('ok')){
        syncBadge.textContent = '';
        syncBadge.className = 'sync-badge';
      }
    }, 2500);
  }
}

async function loadHomeworkFromServer(){
  setSync('sync', '↻');
  try {
    const r = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY }, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const record = data && data.record;
    if (record && typeof record === 'object' && !Array.isArray(record)){
      if (Object.keys(record).length === 1 && record.test !== undefined) homework = {};
      else homework = record;
      store.set('homework', homework);
    } else { homework = {}; }
    setSync('ok', '✓ синхронизировано');
    return true;
  } catch (e) { console.warn(e); setSync('err', '⚠ оффлайн'); return false; }
}

async function saveHomeworkToServer(){
  setSync('sync', '↻');
  try {
    let toSave = homework;
    if (Object.keys(toSave).length === 1 && toSave.test !== undefined) toSave = {};
    const r = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(toSave)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSync('ok', '✓ сохранено');
    return true;
  } catch (e) { console.warn(e); setSync('err', '⚠ ошибка'); return false; }
}

const $ = id => document.getElementById(id);
const main = $('main'), content = $('content'), navLabel = $('navLabel'), adminBtn = $('adminBtn');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function dowIndex(d){ return (d.getDay() + 6) % 7; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function isToday(d){ return ymd(d) === ymd(new Date()); }
function sortLessons(arr){ return arr.slice().sort((a,b)=> (a.time||'').localeCompare(b.time||'')); }

function displaySubject(raw){
  if (!raw) return '';
  const s = String(raw).trim();
  for (const p of SUBJECT_PAIRS){ if (s === p.short || s === p.long) return shortNames ? p.short : p.long; }
  return s;
}

function getRoom(lesson, dow){
  if (lesson.room && lesson.room.trim()) return lesson.room.trim();
  const s = (lesson.subject || '').trim().toLowerCase();
  for (const r of RULES){
    for (const k of r.keys){
      if (s.includes(k)){
        if (r.roomByDow && dow != null && r.roomByDow[dow] != null) return r.roomByDow[dow];
        return r.room || '';
      }
    }
  }
  return '';
}

function getTeacher(lesson){
  if (lesson.teacher && lesson.teacher.trim()) return lesson.teacher.trim();
  const s = (lesson.subject || '').trim().toLowerCase();
  for (const r of RULES){ for (const k of r.keys){ if (s.includes(k)) return r.teacher || ''; } }
  return '';
}

const state = { view:'day', date:new Date(), expandedId:null, editingHwId:null };

function render(opts){
  opts = opts || {};
  updateNavLabel();
  if (state.view === 'day') renderDay();
  else if (state.view === 'week') renderWeek();
  else renderMonth();
  if (!opts.skipFade){ content.classList.remove('anim'); void content.offsetWidth; content.classList.add('anim'); }
  else content.classList.remove('anim');
}

function updateNavLabel(){
  const d = state.date;
  if (state.view === 'day') navLabel.textContent = d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear();
  else if (state.view === 'week'){
    const di = dowIndex(d), mon = addDays(d, -di), sun = addDays(d, 6 - di);
    if (mon.getMonth() === sun.getMonth()) navLabel.textContent = mon.getDate() + ' – ' + sun.getDate() + ' ' + MONTHS_GEN[mon.getMonth()];
    else navLabel.textContent = mon.getDate() + ' ' + MONTHS_GEN[mon.getMonth()] + ' – ' + sun.getDate() + ' ' + MONTHS_GEN[sun.getMonth()];
  } else navLabel.textContent = MONTHS_NOM[d.getMonth()] + ' ' + d.getFullYear();
}

function renderDay(){
  const d = state.date, di = dowIndex(d), ds = ymd(d);
  const lessons = sortLessons(schedule[di] || []);
  const hw = homework[ds] || {};
  let html = '<div class="day-head"><div class="dow">' + DOW_FULL[di] + (isToday(d) ? '<span class="badge-today">сегодня</span>' : '') + '</div><div class="date">' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + ' ' + d.getFullYear() + '</div></div>';
  if (!lessons.length){ html += '<div class="empty"><span class="big">🎉</span>Занятий нет</div>'; }
  else {
    html += '<div class="lessons">';
    lessons.forEach((l, i) => {
      const hwText = hw[l.id] || '';
      const room = getRoom(l, di), teacher = getTeacher(l);
      const expanded = state.expandedId === l.id;
      const editing = state.editingHwId === l.id;
      let hwBlock;
      if (isAdmin && editing){
        hwBlock = '<textarea class="hw-edit" data-hw-for="' + esc(l.id) + '" placeholder="Что задали...">' + esc(hwText) + '</textarea><div class="hw-actions"><button class="save-hw" data-save="' + esc(l.id) + '">Сохранить</button>' + (hwText ? '<button class="delete-hw" data-delete-hw="' + esc(l.id) + '">Удалить</button>' : '') + '<button class="cancel-hw" data-cancel-hw="' + esc(l.id) + '">Отмена</button></div>';
      } else if (isAdmin){
        hwBlock = '<div class="hw-view-row">' + (hwText ? '<div class="hw-display">' + esc(hwText) + '</div>' : '<div class="no-hw">Домашнее задание не задано</div>') + '<button class="pencil-btn" data-edit-hw="' + esc(l.id) + '" title="Изменить ДЗ">✎</button></div>';
      } else {
        hwBlock = hwText ? '<div class="hw-display">' + esc(hwText) + '</div>' : '<div class="no-hw">Домашнее задание не задано</div>';
      }
      html += '<div class="lesson' + (hwText ? ' has-hw' : '') + (expanded ? ' expanded' : '') + '" data-lesson="' + esc(l.id) + '"><div class="lesson-row"><div class="time-col"><div class="time">' + esc(l.time) + '</div><div class="num">' + (i+1) + '</div></div><div class="info"><div class="subject">' + esc(displaySubject(l.subject)) + '</div></div><div class="chev">›</div></div><div class="details"><div class="detail-row"><div class="detail-label">Преподаватель</div>' + (teacher ? '<div class="detail-value teacher">' + esc(teacher) + '</div>' : '<div class="no-teacher">не указан</div>') + '</div><div class="detail-row"><div class="detail-label">Кабинет</div><div class="detail-value room">' + (room ? (room === 'Спортзал' ? esc(room) : 'каб. ' + esc(room)) : 'не указан') + '</div></div><div class="detail-row"><div class="detail-label">Домашнее задание</div>' + hwBlock + '</div>' + (isAdmin ? '<button class="btn-edit-lesson" data-edit="' + esc(l.id) + '">Изменить занятие</button>' : '') + '</div></div>';
    });
    html += '</div>';
  }
  if (isAdmin) html += '<button class="add-btn" id="addLesson">+ Добавить занятие</button><div class="hint">Нажмите на занятие, чтобы развернуть данные.<br>Карандаш ✎ рядом с ДЗ — редактирование домашнего задания.</div>';
  else html += '<div class="hint">Нажмите на занятие, чтобы увидеть преподавателя, кабинет и домашнее задание.</div>';
  content.innerHTML = html;
}

function renderWeek(){
  const di = dowIndex(state.date), mon = addDays(state.date, -di);
  let html = '<div class="week-view">';
  for (let i = 0; i < 7; i++){
    const date = addDays(mon, i), ds = ymd(date);
    const lessons = sortLessons(schedule[i] || []);
    const hw = homework[ds] || {};
    html += '<div class="week-day' + (isToday(date) ? ' today' : '') + '" data-date="' + ds + '"><div class="wd-head"><span class="wd-name">' + DOW_SHORT[i] + '</span><span class="wd-date">' + date.getDate() + '.' + String(date.getMonth()+1).padStart(2,'0') + '</span></div>';
    if (lessons.length){ lessons.forEach(l => { html += '<div class="wd-lesson"><b>' + esc(l.time) + '</b><span class="sub">' + esc(displaySubject(l.subject)) + '</span>' + (hw[l.id] ? '<span class="mark">📝</span>' : '') + '</div>'; }); }
    else html += '<span class="wd-empty">нет занятий</span>';
    html += '</div>';
  }
  html += '</div>';
  content.innerHTML = html;
}

function renderMonth(){
  const d = state.date, year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1), startDow = dowIndex(first);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = ymd(new Date()), selStr = ymd(state.date);
  let html = '<div class="weekdays">' + DOW_SHORT.map(x => '<div>' + x + '</div>').join('') + '</div><div class="grid">';
  for (let i = 0; i < startDow; i++) html += '<div class="cell empty"></div>';
  for (let day = 1; day <= daysInMonth; day++){
    const date = new Date(year, month, day), ds = ymd(date), di = dowIndex(date);
    const hasLessons = (schedule[di] || []).length > 0;
    const hwObj = homework[ds] || {};
    const hasHw = Object.keys(hwObj).some(k => hwObj[k] && hwObj[k].trim());
    html += '<div class="cell' + (ds === todayStr ? ' today' : '') + (ds === selStr ? ' sel' : '') + '" data-date="' + ds + '"><div class="dnum">' + day + '</div><div class="dots">' + (hasLessons ? '<span class="dot lesson-dot"></span>' : '') + (hasHw ? '<span class="dot hw-dot"></span>' : '') + '</div></div>';
  }
  html += '</div><div class="legend"><span><span class="dot lesson-dot"></span>занятия</span><span><span class="dot hw-dot"></span>есть ДЗ</span></div>';
  content.innerHTML = html;
}

let animating = false;
function applyShift(delta){
  state.expandedId = null; state.editingHwId = null;
  if (state.view === 'day') state.date = addDays(state.date, delta);
  else if (state.view === 'week') state.date = addDays(state.date, delta * 7);
  else { const x = new Date(state.date); x.setDate(1); x.setMonth(x.getMonth() + delta); state.date = x; }
}
function shiftNoAnim(delta){ if (animating) return; applyShift(delta); render(); main.scrollTop = 0; }

$('prevBtn').onclick = () => shiftNoAnim(-1);
$('nextBtn').onclick = () => shiftNoAnim(1);
$('todayBtn').onclick = () => { if (animating) return; state.date = new Date(); state.expandedId = null; state.editingHwId = null; render(); main.scrollTop = 0; };
document.querySelectorAll('.bottom button').forEach(btn => { btn.onclick = () => { if (animating) return; state.view = btn.dataset.view; state.expandedId = null; state.editingHwId = null; document.querySelectorAll('.bottom button').forEach(b => b.classList.toggle('active', b === btn)); render(); main.scrollTop = 0; }; });

let startX = 0, startY = 0, curDx = 0, dragging = false, dirLocked = null;
main.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; if (animating) return; if (document.querySelector('.modal-back')) return; startX = e.touches[0].clientX; startY = e.touches[0].clientY; curDx = 0; dragging = false; dirLocked = null; }, {passive:true});
main.addEventListener('touchmove', e => {
  if (animating) return; if (e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
  if (dirLocked === null){ if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; if (Math.abs(dx) > Math.abs(dy) * 1.3) dirLocked = 'h'; else dirLocked = 'v'; }
  if (dirLocked === 'v') return;
  if (e.cancelable) e.preventDefault();
  dragging = true; curDx = dx;
  const w = window.innerWidth, damp = dx * (1 - Math.min(0.55, Math.abs(dx) / (w * 1.4)));
  content.style.transition = 'none';
  content.style.transform = 'translateX(' + damp + 'px)';
  content.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / (w * 1.2)));
}, {passive:false});
main.addEventListener('touchend', e => {
  if (!dragging) return; dragging = false;
  const dx = curDx, w = window.innerWidth, threshold = Math.max(60, w * 0.18);
  if (Math.abs(dx) > threshold) finishSwipe(dx < 0 ? 1 : -1);
  else {
    content.style.transition = 'transform .22s cubic-bezier(.2,.9,.3,1), opacity .22s ease-out';
    content.style.transform = 'translateX(0)'; content.style.opacity = '1';
    setTimeout(() => { content.style.transition = ''; content.style.transform = ''; content.style.opacity = ''; }, 240);
  }
}, {passive:true});

function finishSwipe(direction){
  animating = true; const w = window.innerWidth;
  content.style.transition = 'transform .18s ease-out, opacity .18s ease-out';
  content.style.transform = 'translateX(' + (direction > 0 ? -w * 0.55 : w * 0.55) + 'px)';
  content.style.opacity = '0';
  setTimeout(() => {
    applyShift(direction); render({skipFade:true}); main.scrollTop = 0;
    content.style.transition = 'none';
    content.style.transform = 'translateX(' + (direction > 0 ? w * 0.5 : -w * 0.5) + 'px)';
    content.style.opacity = '0';
    void content.offsetWidth;
    content.style.transition = 'transform .24s cubic-bezier(.2,.9,.3,1), opacity .24s ease-out';
    content.style.transform = 'translateX(0)'; content.style.opacity = '1';
    setTimeout(() => { content.style.transition = ''; content.style.transform = ''; content.style.opacity = ''; animating = false; }, 260);
  }, 190);
}

document.addEventListener('keydown', e => { if (document.querySelector('.modal-back')) return; if (e.key === 'ArrowLeft') shiftNoAnim(-1); if (e.key === 'ArrowRight') shiftNoAnim(1); });

content.addEventListener('click', async e => {
  const pencilBtn = e.target.closest('[data-edit-hw]');
  if (pencilBtn && isAdmin){
    state.editingHwId = pencilBtn.dataset.editHw;
    render({skipFade:true});
    setTimeout(() => {
      const ta = content.querySelector('[data-hw-for="' + state.editingHwId + '"]');
      if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 80);
    return;
  }
  const cancelBtn = e.target.closest('[data-cancel-hw]');
  if (cancelBtn && isAdmin){ state.editingHwId = null; render({skipFade:true}); return; }
  const saveBtn = e.target.closest('[data-save]');
  if (saveBtn && isAdmin){
    const lessonId = saveBtn.dataset.save;
    const ta = content.querySelector('[data-hw-for="' + lessonId + '"]');
    if (ta){
      const ds = ymd(state.date), val = ta.value.trim();
      if (!homework[ds]) homework[ds] = {};
      if (val) homework[ds][lessonId] = val; else delete homework[ds][lessonId];
      if (!Object.keys(homework[ds]).length) delete homework[ds];
      store.set('homework', homework); state.editingHwId = null; render({skipFade:true});
      const ok = await saveHomeworkToServer(); if (!ok) alert('Не удалось сохранить в облако.');
    }
    return;
  }
  const delHw = e.target.closest('[data-delete-hw]');
  if (delHw && isAdmin){
    const lessonId = delHw.dataset.deleteHw;
    if (!confirm('Удалить домашнее задание для этого занятия?')) return;
    const ds = ymd(state.date);
    if (homework[ds]){ delete homework[ds][lessonId]; if (!Object.keys(homework[ds]).length) delete homework[ds]; }
    store.set('homework', homework); state.editingHwId = null; render({skipFade:true});
    const ok = await saveHomeworkToServer(); if (!ok) alert('Не удалось сохранить.');
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn && isAdmin){ openEditor(editBtn.dataset.edit); return; }
  if (e.target.id === 'addLesson'){ openEditor(null); return; }
  const lessonEl = e.target.closest('[data-lesson]');
  if (lessonEl){
    if (e.target.closest('textarea') || e.target.closest('button')) return;
    const id = lessonEl.dataset.lesson;
    const willExpand = (state.expandedId !== id);
    state.expandedId = willExpand ? id : null;
    state.editingHwId = null;
    render({skipFade:true});
    return;
  }
  const dayCell = e.target.closest('[data-date]');
  if (dayCell && state.view !== 'day'){
    state.date = parseYmd(dayCell.dataset.date); state.view = 'day'; state.expandedId = null; state.editingHwId = null;
    document.querySelectorAll('.bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === 'day'));
    render(); main.scrollTop = 0;
  }
});

      '<div class="settings-section"><div class="settings-label">Профиль администратора</div>' + (isAdmin ? '<div class="admin-status"><span class="dot-on"></span>Вы вошли как администратор</div><button class="btn danger" data-act="logout" style="width:100%">Выйти из профиля</button>' : '<button class="btn primary" data-act="openLogin" style="width:100%">Войти как администратор</button>') + '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="cancel">Закрыть</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', ev => {
    const themeBtn = ev.target.closest('[data-theme-set]');
    if (themeBtn){ applyTheme(themeBtn.dataset.themeSet); back.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('active', b.dataset.themeSet === currentTheme)); return; }
    const shortBtn = ev.target.closest('[data-short]');
    if (shortBtn){ shortNames = shortBtn.dataset.short === '1'; store.set('shortNames', shortNames); back.querySelectorAll('[data-short]').forEach(b => b.classList.toggle('active', (b.dataset.short === '1') === shortNames)); render({skipFade:true}); return; }
    const act = ev.target.dataset ? ev.target.dataset.act : null;
    if (ev.target === back || act === 'cancel'){ back.remove(); return; }
    if (act === 'changeBrowser'){ back.remove(); browserChoice = null; store.set('browserChoice', null); showLaunchChoice(); return; }
    if (act === 'install'){ back.remove(); sessionStorage.removeItem('install_dismissed'); tryInstall(); return; }
    if (act === 'openLogin'){ back.remove(); openAdminLogin(); return; }
    if (act === 'logout'){ if (!confirm('Вы уверены, что хотите выйти из аккаунта администратора?')) return; isAdmin = false; store.set('admin', false); updateAdminUI(); back.remove(); render(); return; }
  });
}

function openAdminLogin(){
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal"><div class="modal-title">Вход в профиль администратора</div><label>Введите пароль<input id="login-pass" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off"></label><div class="modal-actions"><button class="btn ghost" data-act="cancel">Отмена</button><button class="btn primary" data-act="login">Войти</button></div></div>';
  document.body.appendChild(back);
  const inp = back.querySelector('#login-pass');
  setTimeout(() => inp.focus(), 100);
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') tryLogin(); });
  function tryLogin(){
    if (inp.value === ADMIN_PASS){ isAdmin = true; store.set('admin', true); updateAdminUI(); back.remove(); openSettings(); render(); }
    else { alert('Неверный пароль'); inp.value = ''; inp.focus(); }
  }
  back.addEventListener('click', ev => {
    const act = ev.target.dataset ? ev.target.dataset.act : null;
    if (ev.target === back || act === 'cancel'){ back.remove(); return; }
    if (act === 'login'){ tryLogin(); }
  });
}

function openEditor(lessonId){
  const di = dowIndex(state.date);
  if (!schedule[di]) schedule[di] = [];
  const lesson = lessonId ? schedule[di].find(l => l.id === lessonId) : null;
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal"><div class="modal-title">' + (lesson ? 'Изменить занятие' : 'Новое занятие') + '</div><label>Время (например 08:30–09:15)<input id="f-time" type="text" value="' + (lesson ? esc(lesson.time) : '08:30–09:15') + '"></label><label>Предмет<input id="f-subject" type="text" placeholder="Математика" value="' + (lesson ? esc(lesson.subject) : '') + '"></label><label>Преподаватель (пусто = подставится по предмету)<input id="f-teacher" type="text" placeholder="Иванов Иван Иванович" value="' + (lesson ? esc(lesson.teacher || '') : '') + '"></label><label>Кабинет (пусто = подставится по предмету)<input id="f-room" type="text" placeholder="например 15" value="' + (lesson ? esc(lesson.room || '') : '') + '"></label><div class="modal-actions"><button class="btn ghost" data-act="cancel">Отмена</button>' + (lesson ? '<button class="btn danger" data-act="delete">Удалить</button>' : '') + '<button class="btn primary" data-act="save">Сохранить</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', ev => {
    const act = ev.target.dataset ? ev.target.dataset.act : null;
    if (ev.target === back || act === 'cancel'){ back.remove(); return; }
    if (act === 'delete'){
      if (!confirm('Удалить занятие из расписания?')) return;
      const ds = ymd(state.date);
      schedule[di] = schedule[di].filter(l => l.id !== lesson.id);
      if (homework[ds]){ delete homework[ds][lesson.id]; if (!Object.keys(homework[ds]).length) delete homework[ds]; }
      store.set('schedule', schedule); store.set('homework', homework); saveHomeworkToServer();
      state.expandedId = null; state.editingHwId = null; back.remove(); render({skipFade:true});
      return;
    }
    if (act === 'save'){
      const time = back.querySelector('#f-time').value.trim() || '08:30–09:15';
      const subject = back.querySelector('#f-subject').value.trim();
      const teacher = back.querySelector('#f-teacher').value.trim();
      const room = back.querySelector('#f-room').value.trim();
      if (!subject){ alert('Введите название предмета'); return; }
      if (lesson){ lesson.time = time; lesson.subject = subject; lesson.teacher = teacher; lesson.room = room; }
      else { const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); schedule[di].push({ id, time, subject, teacher, room }); }
      store.set('schedule', schedule); back.remove(); render({skipFade:true});
    }
  });
}

/* ============================================================
   ВЫБОР БРАУЗЕРА
   ============================================================ */
function showLaunchChoice(){
  if (document.getElementById('launchChoice')) return;
  const overlay = document.createElement('div');
  overlay.id = 'launchChoice';
  overlay.innerHTML = '<div class="launch-card">' +
      '<div class="launch-title">Через какой браузер вы открыли?</div>' +
      '<div class="launch-sub">Это поможет правильно предложить установку на главный экран</div>' +
      '<button class="launch-btn" data-launch="chrome">' +
        '<span class="lb-icon">🌐</span>' +
        '<span class="lb-text"><span class="lb-title">Chrome</span><span class="lb-sub">Android или компьютер</span></span>' +
      '</button>' +
      '<button class="launch-btn" data-launch="safari">' +
        '<span class="lb-icon">🧭</span>' +
        '<span class="lb-text"><span class="lb-title">Safari</span><span class="lb-sub">iPhone или iPad</span></span>' +
      '</button>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-launch]');
    if (!btn) return;
    browserChoice = btn.dataset.launch;
    store.set('browserChoice', browserChoice);
    overlay.remove();
    setTimeout(tryInstall, 500);
  });
}

/* ============================================================
   УСТАНОВКА PWA
   ============================================================ */
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  console.log('[PWA] beforeinstallprompt пойман — установка доступна');
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] установлено');
  deferredPrompt = null;
  removeInstallBanner();
  setSync('ok', '✓ приложение установлено');
  sessionStorage.setItem('install_dismissed', '1');
});

function removeInstallBanner(){
  const b = document.getElementById('installBanner');
  if (b) b.remove();
}

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function tryInstall(){
  if (isStandalone()){
    alert('Приложение уже установлено и открыто с главного экрана.');
    return;
  }

  // Если Chrome готов — вызываем системное окно
  if (deferredPrompt){
    console.log('[PWA] вызываем системное окно установки');
    try {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(choice => {
        console.log('[PWA] userChoice:', choice.outcome);
        if (choice.outcome === 'accepted'){
          setSync('ok', '✓ устанавливается…');
        }
        deferredPrompt = null;
      });
    } catch(e){ console.warn(e); }
    return;
  }

  // Не готов — показываем плашку с объяснением
  showInstallBanner();
}

function showInstallBanner(){
  if (document.getElementById('installBanner')) return;

  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.innerHTML =
    '<div class="ib-icon">📲</div>' +
    '<div class="ib-text">' +
      '<div class="ib-title">Установить приложение?</div>' +
      '<div class="ib-sub">Быстрый доступ к дневнику с рабочего стола</div>' +
      '<div class="ib-actions">' +
        '<button class="ib-btn primary" id="ibInstall">Установить</button>' +
        '<button class="ib-btn ghost" id="ibCancel">Отмена</button>' +
      '</div>' +
    '</div>' +
    '<button class="ib-close" id="ibClose">✕</button>';

  document.body.appendChild(banner);

  document.getElementById('ibInstall').onclick = async () => {
    if (deferredPrompt){
      try {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        console.log('[PWA] userChoice:', choice.outcome);
        deferredPrompt = null;
      } catch(e){ console.warn(e); }
      banner.remove();
    } else {
      // Всё ещё не готов — показываем инструкцию
      banner.remove();
      showInstallHelp();
    }
  };

  document.getElementById('ibCancel').onclick = () => {
    sessionStorage.setItem('install_dismissed', '1');
    banner.remove();
  };
  document.getElementById('ibClose').onclick = () => {
    sessionStorage.setItem('install_dismissed', '1');
    banner.remove();
  };
}

function showInstallHelp(){
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const isChrome = /Chrome/.test(ua) && !/Edg|OPR|YaBrowser/.test(ua);
  const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|FxiOS|EdgiOS/.test(ua);
  const isYandex = /YaBrowser/.test(ua);
  const pageUrl = location.origin + location.pathname;
  let stepsHtml = '';

  if (isYandex){
    stepsHtml =
      '<p>Яндекс.Браузер <b>не поддерживает установку приложений</b> на главный экран.</p>' +
      '<ol>' +
        '<li>Скопируйте ссылку:<br><code>' + pageUrl + '</code></li>' +
        '<li>Откройте её в <b>Chrome</b> (Android) или <b>Safari</b> (iPhone)</li>' +
        '<li>В Chrome нажмите <b>⋮</b> → <b>«Установить приложение»</b></li>' +
      '</ol>';
  } else if (isIOS && isSafari){
    stepsHtml =
      '<ol>' +
        '<li>Нажмите <b>Поделиться</b> <b>⎙</b> внизу экрана</li>' +
        '<li>Выберите <b>«На экран "Домой"»</b></li>' +
        '<li>Нажмите <b>«Добавить»</b></li>' +
      '</ol>';
  } else if (isAndroid && isChrome){
    stepsHtml =
      '<p>Chrome пока не готов предложить установку в один клик. Это значит, что чего-то не хватает в PWA.</p>' +
      '<ol>' +
        '<li>Нажмите <b>⋮</b> в правом верхнем углу Chrome</li>' +
        '<li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b></li>' +
        '<li>Если пункта нет — очистите данные сайта в настройках Chrome и попробуйте снова</li>' +
      '</ol>';
  } else {
    stepsHtml =
      '<p>Откройте эту страницу в <b>Chrome</b> (Android, ПК) или <b>Safari</b> (iPhone) — там установка работает.</p>' +
      '<div class="help-note">Адрес сайта:<br><code>' + pageUrl + '</code></div>';
  }

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal"><div class="modal-title">Установка вручную</div><div class="help-steps">' + stepsHtml + '</div><div class="modal-actions"><button class="btn primary" data-act="close">Понятно</button></div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', e => {
    if (e.target === back || (e.target.dataset && e.target.dataset.act === 'close')) back.remove();
  });
}

/* ============================================================
   СТАРТ
   ============================================================ */
updateAdminUI();
render();
loadHomeworkFromServer().then(ok => { if (ok) render({skipFade:true}); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadHomeworkFromServer().then(ok => { if (ok) render({skipFade:true}); }); });
setInterval(() => { if (!document.hidden) loadHomeworkFromServer().then(ok => { if (ok) render({skipFade:true}); }); }, 30000);

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => {
      console.warn('[PWA] sw.js не зарегистрирован:', e);
    });
  });
}

// Первый запуск или уже выбранный браузер
setTimeout(() => {
  if (isStandalone()) return;
  if (browserChoice === null){
    showLaunchChoice();
  } else if (!sessionStorage.getItem('install_dismissed')){
    // Даём 2.5 секунды, чтобы Chrome успел выдать beforeinstallprompt
    setTimeout(showInstallBanner, 2500);
  }
}, 800);
</script>
